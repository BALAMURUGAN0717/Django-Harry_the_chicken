

{% extends 'base.html' %}
{% block content %}

<style>

.product-box{
    width:100%;
    display:flex;
    justify-content:center;
    margin-top:30px;
}

.card{
    width:380px;
    border:none;
    border-radius:25px;
    overflow:hidden;
    background:#fff;
    transition:0.4s;
    box-shadow:0 10px 30px rgba(0,0,0,0.15);
}

.card:hover{
    transform:translateY(-10px);
    box-shadow:0 15px 40px rgba(255,123,0,0.4);
}

/* IMAGE */

.card-img-top{
    width:100%;
    height:350px;
    object-fit:cover;
    transition:0.5s;
}

.card:hover .card-img-top{
    transform:scale(1.05);
}

/* BODY */

.card-body{
    text-align:center;
    padding:25px;
}

.card-title{
    font-size:30px;
    font-weight:900;
    color:#111;
    margin-bottom:15px;
}

.price{
    font-size:28px;
    font-weight:900;
    color:#ff3c00;
    margin-bottom:15px;
}

.card-text{
    color:#666;
    font-size:16px;
    margin-bottom:25px;
}

/* BUTTON */

.snack-btn{
    width:100%;
    padding:14px 20px;
    border:none;
    border-radius:14px;
    background:linear-gradient(45deg,#ff7b00,#ff0000);
    color:white;
    font-weight:800;
    font-size:17px;
    letter-spacing:1px;
    transition:0.4s;
    box-shadow:0 5px 15px rgba(255,123,0,0.4);
}

.snack-btn:hover{
    background:linear-gradient(45deg,#111,#333);
    transform:translateY(-3px) scale(1.03);
    box-shadow:0 8px 20px rgba(0,0,0,0.5);
    color:#ffcc00;
}

</style>

<div class="product-box">

    <div class="card">

        <img src="{{ i.image.url }}"
             class="card-img-top"
             alt="product image">

        <div class="card-body">

            <h4 class="card-title">
                {{ i.name }}
            </h4>

            <h5 class="price">
                ₹ {{ i.price }}
            </h5>

            <p class="card-text">
                {{ i.discription }}
            </p>

            <a href="{% url 'add_to_cart' i.id %}">

                <button class="snack-btn">

                    <i class="fa-solid fa-cart-shopping me-2"></i>
                    Add to Cart
                 </button>
            </a>
        </div>
    </div>
</div>

{% endblock %}
