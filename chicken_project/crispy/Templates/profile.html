{% extends 'base.html' %}

{% block content %}

<style>
    body {
        background: linear-gradient(to right, #fff8f0, #fff3e6);
    }

    /* HEADING */

    .menu-heading {
        text-align: center;
        margin-bottom: 55px;
    }

    .menu-heading h1 {
        font-size: 58px;
        font-weight: 900;
        color: #111;
        letter-spacing: 2px;
        text-transform: uppercase;
        text-shadow: 3px 3px 12px rgba(0,0,0,0.15);
    }

    .menu-heading p {
        color: #777;
        font-size: 18px;
        margin-top: 12px;
        letter-spacing: 1px;
    }

    /* LINK REMOVE */

    .product-link{
        text-decoration: none;
        color: inherit;
    }

    /* CARD */

    .card {
        border: none;
        border-radius: 24px;
        overflow: hidden;
        transition: 0.45s ease;
        background: white;
        position: relative;
    }

    .card:hover {
        transform: translateY(-12px) scale(1.02);
        box-shadow: 0 18px 40px rgba(0,0,0,0.18) !important;
    }

    /* IMAGE */

    .card-img-box{
        overflow: hidden;
    }

    .card img {
        transition: 0.6s;
    }

    .card:hover img {
        transform: scale(1.08);
    }

    /* BODY */

    .card-body{
        padding: 22px;
    }

    .card-title {
        font-weight: 800;
        color: #111;
        font-size: 24px;
        margin-bottom: 10px;
    }

    .price {
        font-size: 22px;
        font-weight: 900;
        color: #ff4d00;
        margin-bottom: 12px;
    }

    .card-text {
        color: #666;
        line-height: 1.6;
        font-size: 15px;
    }

    /* BUTTON */

    .snack-btn {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 14px;
        background: linear-gradient(45deg,#ff7b00,#ff0000);
        color: white;
        font-weight: 700;
        letter-spacing: 1px;
        transition: 0.4s;
        margin-top: 15px;
    }

    .snack-btn:hover{
        background: linear-gradient(45deg,#111,#333);
        color: #ffcc00;
        transform: scale(1.03);
    }

    /* BADGE */

    .food-badge{
        position: absolute;
        top: 15px;
        right: 15px;
        background: #ff3300;
        color: white;
        padding: 6px 14px;
        border-radius: 50px;
        font-size: 13px;
        font-weight: bold;
        z-index: 10;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

</style>

<section class="py-5">
    <div class="container">

        <div class="menu-heading">
            <h1>🍗 Crispy Snacks</h1>
            <p>Hot • Crispy • Delicious Taste</p>
            {% if selected_category %}
            <span class="badge bg-danger fs-6 px-3 py-2 rounded-pill mt-2">{{ selected_category }}</span>
            {% endif %}
        </div>

        <div class="row g-4">

            {% for i in data %}

            <div class="col-lg-3 col-md-4 col-sm-6">

                <a href="{% url 'product_details' i.id %}" class="product-link">

                    <div class="card h-100 shadow">

                        <div class="food-badge">
                            HOT 🔥
                        </div>

                        <div class="card-img-box">
                            <img src="{{ i.image.url }}"
                                 class="card-img-top"
                                 style="height:250px; object-fit:cover;"
                                 alt="product image">
                        </div>

                        <div class="card-body">

                            <h4 class="card-title">
                                {{ i.name }}
                            </h4>

                            <div class="price">
                                ₹ {{ i.price }}
                            </div>

                            <p class="card-text">
                                {{ i.discription }}
                            </p>

                            <button class="snack-btn">
                                Order Now 🍔
                            </button>

                        </div>

                    </div>

                </a>

            </div>

            {% endfor %}

        </div>
    </div>
</section>

{% endblock %}
