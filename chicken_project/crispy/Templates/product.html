{% extends 'base.html' %}

{% block content %}

<section class="py-5">
    <div class="container">
        <div class="row g-4">

            {% for i in data %}

            <div class="col-lg-3 col-md-4 col-sm-6">
                <div class="card h-100 shadow">

                    <img src="{{ i.image.url }}"
                         class="card-img-top"
                         style="height:250px; object-fit:cover;"
                         alt="product image">

                    <div class="card-body">
                        <h4 class="card-title">{{ i.name }}</h4>

                        <h5 class="text-success">
                            ₹ {{ i.price }}
                        </h5>

                        <p class="card-text">
                            {{ i.discription }}
                        </p>
                    </div>

                </div>
            </div>

            {% endfor %}

        </div>
    </div>
</section>

{% endblock %}
