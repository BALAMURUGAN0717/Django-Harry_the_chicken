{% extends 'base.html' %}

{% block content %}

<style>

/* ---------------- Register Page ---------------- */

.registerstyle{
    width:100%;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(to right, #1f1f1f, #3d3d3d);
}

/* Register Box */

.formstyle{
    width:430px;
    padding:40px 30px;
    border-radius:25px;
    background: rgba(255,255,255,0.96);

    display:flex;
    flex-direction:column;
    align-items:center;

    box-shadow:0 8px 35px rgba(0,0,0,0.6);
    transition:0.4s;
}

.formstyle:hover{
    transform:translateY(-5px);
    box-shadow:0 10px 40px rgba(255,140,0,0.6);
}

/* Heading */

.register-heading{
    font-size:38px;
    font-weight:900;
    color:#ff8800;
    margin-bottom:30px;
    letter-spacing:2px;
    text-shadow:2px 2px 10px rgba(0,0,0,0.3);
}

/* Labels */

.registerf{
    width:85%;
    font-size:18px;
    font-weight:700;
    margin-bottom:8px;
    color:#333;
}

/* Inputs */

.inputstyle,
.styleemail{
    width:85%;
    height:45px;
    border-radius:14px;
    border:2px solid #555;
    padding-left:15px;
    font-size:16px;
    margin-bottom:20px;
    transition:0.3s;
}

.inputstyle:focus,
.styleemail:focus{
    outline:none;
    border-color:orange;
    box-shadow:0 0 12px rgba(255,165,0,0.7);
}

/* Button */

.registerbtn{
    width:190px;
    height:48px;
    border:none;
    border-radius:30px;
    background:linear-gradient(to right, orange, red);
    color:white;
    font-size:18px;
    font-weight:800;
    letter-spacing:1px;
    cursor:pointer;
    transition:0.4s;
    margin-top:10px;

    box-shadow:0 5px 18px rgba(255,140,0,0.5);
}

.registerbtn:hover{
    transform:scale(1.08);
    background:linear-gradient(to right, red, orange);
    box-shadow:0 8px 25px rgba(255,69,0,0.8);
}

</style>


<div class="registerstyle">

    <form method="POST" class="formstyle">

        {% csrf_token %}

        <!-- Heading -->
        <h1 class="register-heading">REGISTER</h1>

        {% if mgs %}
        <p style="color: #ff3333; font-weight: bold; margin-bottom: 15px; text-align: center;">{{ mgs }}</p>
        {% endif %}

        <!-- Username -->
        <label class="registerf">Username</label>
        <input type="text" 
               name="username" 
               class="inputstyle"
               placeholder="Enter username"
               required>

        <!-- Email -->
        <label class="registerf">Email</label>
        <input type="email" 
               name="email" 
               class="styleemail"
               placeholder="Enter email"
               required>

        <!-- Password -->
        <label class="registerf">Password</label>
        <input type="password" 
               name="password" 
               class="inputstyle"
               placeholder="Enter password"
               required>

        <!-- Button -->
        <button type="submit" class="registerbtn">
            Register
        </button>

        <p class="mt-4 mb-0 text-secondary" style="font-size: 15px;">
            Already have an account? 
            <a href="{% url 'login' %}" class="text-warning fw-bold text-decoration-none ms-1">Login here</a>
        </p>

    </form>

</div>

{% endblock %}
