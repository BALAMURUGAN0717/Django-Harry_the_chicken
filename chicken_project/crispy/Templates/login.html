{% extends 'base.html' %}
{% block content %}

<style>

/* ---------------- Login Page ---------------- */

.loginpage{
    width:100%;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(to right, #1f1f1f, #3b3b3b);
}

/* Login Box */

.logpage{
    width:420px;
    padding:40px 30px;
    border-radius:25px;
    background: rgba(255,255,255,0.95);
    box-shadow: 0 8px 35px rgba(0,0,0,0.6);

    display:flex;
    flex-direction:column;
    align-items:center;

    transition:0.4s;
}

.logpage:hover{
    transform:translateY(-5px);
    box-shadow: 0 10px 40px rgba(255, 166, 0, 0.6);
}

/* Heading */

.login-heading{
    font-size:38px;
    font-weight:900;
    color:#ff8800;
    margin-bottom:30px;
    text-shadow: 2px 2px 10px rgba(0,0,0,0.3);
    letter-spacing:2px;
}

/* Labels */

.uselog{
    font-size:18px;
    font-weight:700;
    margin-bottom:8px;
    align-self:flex-start;
    margin-left:45px;
    color:#333;
}

/* Inputs */

.logpage input{
    width:85%;
    height:45px;
    border-radius:14px;
    border:2px solid #555;
    padding-left:15px;
    font-size:16px;
    margin-bottom:20px;
    transition:0.3s;
}

.logpage input:focus{
    outline:none;
    border-color:orange;
    box-shadow:0 0 12px rgba(255,165,0,0.7);
}

/* Button */

.logbutton{
    width:180px;
    height:48px;
    border:none;
    border-radius:30px;
    background: linear-gradient(to right, orange, red);
    color:white;
    font-size:18px;
    font-weight:800;
    letter-spacing:1px;
    cursor:pointer;
    transition:0.4s;
    box-shadow:0 5px 18px rgba(255,140,0,0.5);
}

.logbutton:hover{
    transform:scale(1.08);
    background: linear-gradient(to right, red, orange);
    box-shadow:0 8px 25px rgba(255,69,0,0.8);
}

</style>


<div class="loginpage">

    <form method="POST" class="logpage">

        {% csrf_token %}

        <!-- Heading -->
        <h1 class="login-heading">LOGIN</h1>

        {% if mgs %}
        <p style="color: #ff3333; font-weight: bold; margin-bottom: 15px; text-align: center;">{{ mgs }}</p>
        {% endif %}

        <!-- Username -->
        <label class="uselog">Username</label>
        <input type="text" 
               name="username" 
               placeholder="Enter username"
               required>

        <!-- Password -->
        <label class="uselog">Password</label>
        <input type="password" 
               name="password" 
               placeholder="Enter password"
               required>

        <!-- Button -->
        <button type="submit" class="logbutton">
            Login
        </button>

        <p class="mt-4 mb-0 text-secondary" style="font-size: 15px;">
            Don't have an account? 
            <a href="{% url 'register' %}" class="text-warning fw-bold text-decoration-none ms-1">Register here</a>
        </p>

    </form>

</div>

{% endblock %}
